server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/knowledge_system
    username: postgres
    password: 123456
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true

file:
  upload:
    path: ./uploads

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledgesystem.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.knowledgesystem.controller

ai:
  api-key: 
  model: qwen-max
  base-url: https://dashscope.aliyuncs.com
  max-tokens: 2000
  temperature: 0.7
  max-context-messages: 20
  system-prompt: 你是一个专业的知识图谱AI助手，擅长分析知识图谱中的节点和关系。请根据用户的问题，结合知识图谱的上下文，给出专业、准确、有帮助的回答。

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: knowledge-files
  part-size: 10485760
  data-dir: D:\WorkSpace\openclaw\project3\KS\KnowledgeSystem\minio-data
